 {name:'新構法・免震制振', ids:['systems']}

const app=document.getElementById('app');
const homeBtn=document.getElementById('homeBtn');
let current=null, page=0, states=[];
const storageKey='tokubetsuku_structural_2026_scores';
const getScores=()=>{try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){return {}}};
const setScores=o=>localStorage.setItem(storageKey,JSON.stringify(o));

function normalize(s){
 return String(s??'').trim().toLowerCase()
  .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
  .replace(/[Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
  .replace(/，/g,',').replace(/．/g,'.').replace(/／/g,'/')
  .replace(/[\s　]/g,'').replace(/,/g,'')
  .replace(/平方ミリメートル/g,'mm2').replace(/平方メートル/g,'m2')
  .replace(/n\/mm²/g,'').replace(/n\/mm2/g,'').replace(/n\/m²/g,'').replace(/n\/m2/g,'')
  .replace(/mm|cm|％|%|本|倍$/g,'')
  .replace(/[・･]/g,'');
}
function accepted(q, user){
 const vals=[q[1],...(q[2]||[])].map(normalize);
 const u=normalize(user);
 return vals.includes(u);
}
function blankify(text){return text.replace('（　）','<span class="blankMark">　　　</span>')}

function renderHome(){
 current=null; page=0; states=[]; homeBtn.style.display='none';
 const scores=getScores();
 app.innerHTML=`
 <section class="hero"><h1>特別区 建築構造<br>未出穴埋め100</h1><p>1セット10問・2ページ構成。各ページ5問ずつ縦に解答し、判定ボタンで即時に正誤を確認できます。明日までなら「最優先」から。</p></section>
 <div class="notice"><b>出題方針：</b> 公開確認した近年の特別区・建築構造で、すでに直接問われた論点は原則として除外。未出の周辺法規・構造用語を、秋試験と同等〜やや高めにしています。<br><b>おすすめ：</b> 今夜は問題1→4を2周、余力があれば5→8。9・10は最後でOK。</div>
 <button class="catalogLaunch" onclick="renderCatalog()">☰ 分野別・100問一覧を見る</button>
 <div class="legend"><span class="badge s">最優先</span><span class="badge a">重要</span><span class="badge b">余力</span></div>
 <div class="grid">${sets.map(s=>{
   const sc=scores[s.id];
   return `<article class="setCard"><div class="setTop"><div><div class="setNo">問題 ${s.no} / 10問</div><div class="setTitle">${s.title}</div></div><span class="badge ${s.priority}">${s.ptxt}</span></div><div class="setDesc">${s.desc}</div><div class="setFoot"><div class="score">${sc!=null?`前回 ${sc}/10`:'未挑戦'}</div><div class="setBtns"><button class="listMini" onclick="renderCatalog('${s.id}')">一覧</button><button class="start" onclick="startSet('${s.id}')">開始</button></div></div></article>`
 }).join('')}</div>
 <div class="footerNote">法規数値は2026年9月時点の現行規定を前提に作成。自治体条例等による上乗せがあるものは一般規定を出題しています。</div>`;
}


function listQuestionText(text){
 return escapeHtml(text).replace('（　）','<span class="listBlank">（　　　）</span>');
}
function renderCatalog(focusId=null){
 current=null; page=0; states=[]; homeBtn.style.display='block';
 app.innerHTML=`
 <section class="catalogHero"><h1>分野別・問題一覧</h1><p>未出予想100問を分野別に確認できます。答えはここでは表示しません。覚えたい項目を見つけたら、そのセットからすぐ演習できます。</p></section>
 ${catalogGroups.map(g=>{
   const groupSets=g.ids.map(id=>sets.find(s=>s.id===id)).filter(Boolean);
   const count=groupSets.reduce((n,s)=>n+s.qs.length,0);
   return `<section class="catalogGroup"><h2 class="groupTitle">${g.name}<span class="groupCount">${count}問</span></h2>${groupSets.map(s=>`
    <article class="catalogSet" id="catalog-${s.id}"><div class="catalogSetHead"><div><div class="catalogSetNo">問題 ${s.no} ・ ${s.ptxt}</div><div class="catalogSetTitle">${s.title}</div></div><button class="catalogStart" onclick="startSet('${s.id}')">この10問を解く</button></div>
    <ol class="problemList">${s.qs.map(q=>`<li>${listQuestionText(q[0])}</li>`).join('')}</ol></article>`).join('')}</section>`
 }).join('')}
 <button class="catalogBack" onclick="renderHome()">ホームへ戻る</button>
 <div class="footerNote">一覧は問題文のみ表示。正答・解説は演習画面で判定後に確認できます。</div>`;
 if(focusId){
   setTimeout(()=>{const el=document.getElementById('catalog-'+focusId);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},0);
 } else { window.scrollTo({top:0,behavior:'instant'}); }
}

function startSet(id){
 current=sets.find(s=>s.id===id); page=0; states=current.qs.map(()=>({value:'',judged:false,ok:false})); homeBtn.style.display='block'; renderQuiz(); window.scrollTo({top:0,behavior:'instant'});
}
function renderQuiz(){
 const start=page*5, qs=current.qs.slice(start,start+5);
 app.innerHTML=`<div class="quizHead"><div class="crumb">問題 ${current.no} ・ ${page+1}/2ページ</div><div class="quizTitle">${current.title}</div><div class="progressTrack"><div class="progressBar" style="width:${page?100:50}%"></div></div><div class="pageNote">問${start+1}〜${start+5}。入力後「判定」で即チェックできます。</div></div>
 <div class="qList">${qs.map((q,i)=>qHTML(start+i,q)).join('')}</div>
 <div class="actions"><button class="bigBtn checkAll" onclick="checkPage()">5問まとめて採点</button><button class="bigBtn next" onclick="nextPage()">${page===0?'次の5問へ':'結果を見る'}</button></div>`;
 qs.forEach((q,i)=>restoreUI(start+i));
}
function qHTML(idx,q){
 const st=states[idx];
 return `<section class="q ${st.judged?(st.ok?'correct':'wrong'):''}" id="q${idx}"><div class="qnum">Q${idx+1}</div><div class="qtext">${blankify(q[0])}</div><div class="answerRow"><input class="ans" id="a${idx}" autocomplete="off" autocapitalize="off" placeholder="答えを入力" value="${escapeHtml(st.value)}" oninput="saveVal(${idx},this.value)" onkeydown="if(event.key==='Enter'){judge(${idx})}"><button class="judge" onclick="judge(${idx})">判定</button></div><div class="feedback"><div class="fbTitle"></div><div class="explain"></div></div></section>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveVal(i,v){states[i].value=v;states[i].judged=false;states[i].ok=false;const el=document.getElementById('q'+i); if(el){el.classList.remove('correct','wrong');}}
function judge(i){
 const q=current.qs[i], input=document.getElementById('a'+i); if(input)states[i].value=input.value;
 const ok=accepted(q,states[i].value); states[i].judged=true; states[i].ok=ok;
 const el=document.getElementById('q'+i); el.classList.remove('correct','wrong'); el.classList.add(ok?'correct':'wrong');
 const t=el.querySelector('.fbTitle'), ex=el.querySelector('.explain');
 t.textContent=ok?'✓ 正解':'✕ 不正解　正答：'+q[1]; ex.textContent=q[3];
}
function restoreUI(i){
 if(!states[i].judged)return; const q=current.qs[i],el=document.getElementById('q'+i); if(!el)return;
 const t=el.querySelector('.fbTitle'),ex=el.querySelector('.explain'); t.textContent=states[i].ok?'✓ 正解':'✕ 不正解　正答：'+q[1]; ex.textContent=q[3];
}
function checkPage(){for(let i=page*5;i<page*5+5;i++)judge(i)}
function nextPage(){
 checkPage();
 if(page===0){page=1;renderQuiz();window.scrollTo({top:0,behavior:'smooth'})} else renderResult();
}
function renderResult(){
 const score=states.filter(s=>s.ok).length; const scores=getScores(); scores[current.id]=score; setScores(scores);
 let msg=score===10?'満点。ここは仕上がっています。':score>=8?'かなり良いです。間違いだけ再確認。':score>=6?'あと一周で固められます。':'今夜もう一周して数字を固定。';
 app.innerHTML=`<section class="result"><div class="crumb">問題 ${current.no} 完了</div><div class="scoreBig">${score}<span style="font-size:20px;color:#98a2b3">/10</span></div><div class="resultMsg">${msg}</div><div class="resultSub">間違えた問題は、もう一度このセットを解くと定着しやすいです。明日直前は「正答＋一行解説」だけ見返す使い方でもOK。</div><div class="resultBtns"><button class="again" onclick="startSet('${current.id}')">もう一度</button><button class="back" onclick="renderHome()">ホームへ</button></div></section>`;
}
homeBtn.onclick=renderHome;
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
renderHome();
</script>
